<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - EverHaven</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align:center; }
        h1 { color:#1a1a2e; margin-bottom: 10px; }
        p { color:#666; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; }
        button { width: 100%; padding: 14px; background: #1a1a2e; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .error { color: #e53935; margin-bottom: 12px; }
        .success { color: #2e7d32; margin-bottom: 12px; }
        a { color:#1a1a2e; text-decoration:none; font-weight:600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reset Password</h1>
        <p>Enter recovery PIN: <strong>2468</strong></p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        {% if success %}<div class="success">{{ success }}</div>{% endif %}
        <form method="POST" action="/forgot-password">
            <input type="text" name="recovery_pin" placeholder="Recovery PIN" required>
            <input type="password" name="new_password" placeholder="New Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
            <button type="submit">Reset Password</button>
        </form>
        <p style="margin-top:18px;"><a href="/login">← Back to Login</a></p>
    </div>
</body>
</html>
