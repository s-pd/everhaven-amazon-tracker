<!DOCTYPE html>
<html>
<head>
    <title>Change Password - EverHaven</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; }
        .header { background-color: #1a1a2e; color: white; padding: 20px 0; text-align: center; }
        .container { max-width: 450px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 20px; text-align: center; color: #1a1a2e; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; }
        button { width: 100%; padding: 14px; background: #1a1a2e; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .error { color: #e53935; margin-bottom: 12px; }
        .success { color: #2e7d32; margin-bottom: 12px; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #1a1a2e; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header"><h1>EverHaven</h1></div>
    <div class="container">
        <div class="card">
            <h2>Change Password</h2>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            {% if success %}<div class="success">{{ success }}</div>{% endif %}
            <form method="POST" action="/change-password">
                <input type="password" name="current_password" placeholder="Current Password" required>
                <input type="password" name="new_password" placeholder="New Password" required>
                <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
                <button type="submit">Update Password</button>
            </form>
        </div>
        <div class="links"><a href="/">← Home</a></div>
    </div>
</body>
</html>
